<!DOCTYPE html>
<html lang="en">
  <head th:replace="~{common/header :: moduleHeaderFragment}">
    <!-- Ensure Bootstrap CSS is included in the header if not already -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav th:replace="~{common/sidebar :: sidebarFragment}"></nav>

        <!-- Main Content -->
        <div class="col-md-9 ms-sm-auto col-lg-10">
          <div class="row">
            <!-- Top Navbar -->
            <nav th:replace="~{common/topnavbar :: topnavbarFragment}"></nav>
          </div>

          <!-- User Account Form in a Medium Card -->
          <div class="container mt-4">
            <div class="row justify-content-center">
              <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                  <div class="card-header fw-bold">User Details</div>
                  <div class="card-body">
                    <form onsubmit="return false" id="FormUser">
                      <div class="row mb-3">
                        <div class="col">
                          <label for="textUserName" class="form-label fw-bold">User Name: <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" placeholder="User Name*" id="textUserName"
                            onkeyup="textFeildValidator(this, '^[a-zA-Z0-9]{5,16}$', 'loggedUser', 'username')" required>
                        </div>
                        <div class="col">
                          <label for="textPassword" class="form-label fw-bold">Password: <span class="text-danger">*</span></label>
                          <input type="password" class="form-control" placeholder="Password*" id="textPassword"
                            onkeyup="textFeildValidator(this, '^[a-zA-Z0-9]{5,16}$', 'loggedUser', 'password')" required>
                        </div>
                      </div>

                      <div class="row mb-3">
                        <div class="col">
                          <label for="textRTPassword" class="form-label fw-bold">Re-type password: <span class="text-danger">*</span></label>
                          <input type="password" placeholder="Re-type Password*" class="form-control" id="textRTPassword"
                            onkeyup="passwordRTValidator()" autocomplete="new-password" required>
                        </div>
                        <div class="col">
                          <label for="textEmail" class="form-label fw-bold">Email: <span class="text-danger">*</span></label>
                          <input type="email" class="form-control" placeholder="Email*" id="textEmail" required
                            onkeyup="textFeildValidator(this, '^[A-Za-z0-9]{6,20}[@][a-z]{3,10}[.][a-z]{2,3}$', 'loggedUser', 'email')">
                        </div>
                      </div>

                      <div class="mb-3">
                        <label for="textNote" class="form-label fw-bold">Note:</label>
                        <textarea class="form-control" rows="3" placeholder="Note" id="textNote"
                          onkeyup="textFeildValidator(this, '^.*$', 'user', 'note')"></textarea>
                      </div>

                      <div class="mb-3">
                        <label class="form-label fw-bold">Add Image:</label><br>
                        <button type="button" class="btn btn-primary btn-sm" onclick="fileuserphoto.click()">Select Image</button>
                        <button type="button" class="btn btn-info btn-sm" onclick="buttonClearImage();">Clear Image</button>
                        <img src="resource/images/profile_image.png" alt="No image" style="height: 50px; width: 50px;" id="imgUserphoto" class="ms-2">
                        <input type="text" disabled class="form-control mt-2" id="textUserphoto">
                        <input type="file" class="form-control d-none" id="fileuserphoto"
                          onchange="validatefilefeild(this, 'loggedUser', 'photo', 'photopath', 'olduser', imgUserphoto, textUserphoto)">
                      </div>

                      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button class="btn btn-md btn-success" type="submit" id="btnAddUser" onclick="submitUserSetting()">Update</button>
                        <button class="btn btn-md btn-secondary" type="reset">Clear</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div> <!-- end col -->
            </div> <!-- end row -->
          </div> <!-- end container -->

        </div> <!-- end main content col -->
      </div> <!-- end row -->
    </div> <!-- end container-fluid -->

    <!-- Your JS -->
    <script src="resource/js/sidebar.js"></script>

    <script src="resource/controller.js/userProfile.js" type="text/javascript"></script>
  </body>
</html>
